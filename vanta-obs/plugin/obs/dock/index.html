<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vanta OBS Companion</title>
    <style>
      :root {
        color-scheme: dark;
        background: #080808;
        color: #f5f5f5;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-width: 280px;
      }
      main {
        display: grid;
        gap: 10px;
        padding: 12px;
      }
      .vanta-dock-status,
      .vanta-dock-actions {
        display: grid;
        gap: 8px;
      }
      .vanta-dock-status {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        font-size: 12px;
      }
      .vanta-dock-status strong {
        color: #3ddc97;
        text-transform: uppercase;
      }
      .vanta-dock-status span {
        color: #b8b8b8;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .vanta-dock-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      button {
        min-height: 30px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: #171717;
        color: #f5f5f5;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button:disabled {
        color: #777;
        cursor: progress;
      }
    </style>
  </head>
  <body>
    <main data-vanta-obs-dock></main>
    <script type="module" src="./vanta-obs-dock.js"></script>
  </body>
</html>
